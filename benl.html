<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function() {
    var BINOM_URL = "https://infovista.pro/click?key=8b72e9816df144dbbf11b789727751d6";
    var adId = "";
    try {
        var hash = window.location.hash || "";
        var search = window.location.search || "";
        var all = hash + "&" + search;
        var match = all.match(/tgWebAppStartParam=([^&]+)/);
        if (match) adId = match[1];
        if (!adId) {
            match = all.match(/startapp=([^&]+)/);
            if (match) adId = match[1];
        }
    } catch(e) {}
    var url = BINOM_URL;
    if (adId) url = BINOM_URL + "&ad_id=" + adId;
    window.location.href = url;
})();
</script>
</head>
<body></body>
</html>
